name: Substack watcher
on:
  schedule:
    - cron: "17 * * * *"   # hourly at :17 — amplify new Happy Foods Substack posts
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: push-bots-state
  cancel-in-progress: false
jobs:
  substack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Connect via Cloudflare WARP
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wireguard-tools
          WGCF_URL=""
          for i in 1 2 3 4; do
            WGCF_URL=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/ViRb3/wgcf/releases/latest | grep -o 'https://[^"]*linux_amd64[^"]*' | head -1)
            [ -n "$WGCF_URL" ] && break
            echo "wgcf lookup attempt $i came back empty, retrying..."
            sleep 15
          done
          if [ -z "$WGCF_URL" ]; then echo "wgcf download URL lookup failed"; exit 1; fi
          curl -fsSL "$WGCF_URL" -o wgcf && chmod +x wgcf
          ./wgcf register --accept-tos >/dev/null 2>&1
          ./wgcf generate >/dev/null 2>&1
          sudo install -m 600 wgcf-profile.conf /etc/wireguard/wgcf.conf
          sudo wg-quick up wgcf
          echo "--- egress check ---"
          curl -s --max-time 20 https://www.cloudflare.com/cdn-cgi/trace | grep -E '^(ip|warp)=' || true
      - name: Amplify new Substack posts
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          TUMBLR_CONSUMER_KEY: ${{ secrets.TUMBLR_CONSUMER_KEY }}
          TUMBLR_CONSUMER_SECRET: ${{ secrets.TUMBLR_CONSUMER_SECRET }}
          TUMBLR_TOKEN: ${{ secrets.TUMBLR_TOKEN }}
          TUMBLR_TOKEN_SECRET: ${{ secrets.TUMBLR_TOKEN_SECRET }}
          TUMBLR_BLOG: ${{ secrets.TUMBLR_BLOG }}
        run: |
          pip install -q requests requests-oauthlib
          python3 bot.py substack || true
      - name: Disconnect WARP
        if: always()
        run: sudo wg-quick down wgcf || true
      - name: Commit state
        run: |
          git config user.name "push-bots"
          git config user.email "push-bots@users.noreply.github.com"
          git add state REPORT.md 2>/dev/null || git add state
          git diff --cached --quiet || git commit -m "substack run state [skip ci]"
          git push
