name: Weekly roundup (Sunday)
on:
  schedule:
    - cron: "15 16 * * 0"   # ~11:15 AM CT Sundays
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: push-bots-state
  cancel-in-progress: false
jobs:
  roundup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Post weekly roundups
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: |
          for s in churnmilk gravytoast overpepper; do
            python3 bot.py roundup --site $s || true
            sleep 20
          done
      - name: Commit state
        run: |
          git config user.name "push-bots"
          git config user.email "push-bots@users.noreply.github.com"
          git add state
          git diff --cached --quiet || git commit -m "roundup run state [skip ci]"
          git push
