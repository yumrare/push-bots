name: Daily features
on:
  schedule:
    - cron: "5 15 * * *"   # ~10:05 AM CT daily
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: push-bots-state
  cancel-in-progress: false
jobs:
  features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Post daily features (all three sites)
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          TUMBLR_CONSUMER_KEY: ${{ secrets.TUMBLR_CONSUMER_KEY }}
          TUMBLR_CONSUMER_SECRET: ${{ secrets.TUMBLR_CONSUMER_SECRET }}
          TUMBLR_TOKEN: ${{ secrets.TUMBLR_TOKEN }}
          TUMBLR_TOKEN_SECRET: ${{ secrets.TUMBLR_TOKEN_SECRET }}
          TUMBLR_BLOG: ${{ secrets.TUMBLR_BLOG }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: |
          pip install -q requests requests-oauthlib
          for s in churnmilk gravytoast overpepper; do
            python3 bot.py feature --site $s || true
            sleep 20
          done
      - name: Commit state
        run: |
          git config user.name "push-bots"
          git config user.email "push-bots@users.noreply.github.com"
          git add state REPORT.md 2>/dev/null || git add state
          git diff --cached --quiet || git commit -m "feature run state [skip ci]"
          git push
